spring.application.name=car_auction

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.datasource.url=jdbc:postgresql://localhost:5432/car_auction
spring.datasource.username=ivanibarra
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.web.error.include-message=never
 
app.demo.csv-path=${APP_DEMO_CSV_PATH:./data/iaai_dataset_download.csv}